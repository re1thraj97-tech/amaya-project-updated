<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>transfer</title></head><body>
<script>
(async function(){
  try{
    var p = new URLSearchParams(location.hash.slice(1));
    var url = decodeURIComponent(p.get('u') || '');
    var name = p.get('n') || 'out.jpg';
    var w = parseInt(p.get('w') || '1400', 10);
    var q = parseFloat(p.get('q') || '0.82');
    var blob = await (await fetch(url)).blob();
    var bmp = await createImageBitmap(blob);
    var h = Math.round(bmp.height * w / bmp.width);
    var c = new OffscreenCanvas(w, h);
    c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    var jpg = await c.convertToBlob({type:'image/jpeg', quality:q});
    var buf = await jpg.arrayBuffer();
    parent.postMessage({__amaya:true, name:name, ok:true, buf:buf, w:w, h:h}, '*');
  }catch(e){
    parent.postMessage({__amaya:true, ok:false, error:String(e)}, '*');
  }
})();
<\/script>
</body></html>
